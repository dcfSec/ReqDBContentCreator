[project]
name = "reqdbcontentcreator"
version = "0.4.4"
description = ""
readme = "README.md"
authors = [{ name = "Fischer, Daniel-MGB", email = "daniel.fischer@mgb.ch" }]
requires-python = ">=3.10,<4.0"
dependencies = [
    "argparse>=1.4.0,<2.0.0",
    "requests>=2.32.3,<3.0.0",
    "reqdb>=0.12.0,<0.13.0",
    "pyyaml>=6.0.2,<7.0.0",
    "excelextractor>=0.1.0,<0.2.0",
    "pypandoc>=1.14,<2.0.0",
]

[project.scripts]
reqdbcontentcreator = "reqdbcontentcreator.__main__:main"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
